<title>ETERNAL TIDES | Official</title>

<meta name="description" content="ETERNAL TIDES — An upcoming pirate adventure on Roblox.">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background:
            radial-gradient(circle at 50% 35%, rgba(12, 81, 108, 0.35), transparent 45%),
            linear-gradient(135deg, #02070c, #061521 55%, #02070c);
        color: #eee8d5;
    }

    a {
        text-decoration: none;
        color: inherit;
    }

    /* =========================
       NAVBAR
    ========================= */

    nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 76px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 5%;

        background: rgba(2, 7, 12, 0.88);
        backdrop-filter: blur(14px);

        border-bottom: 1px solid rgba(221, 188, 105, 0.18);

        z-index: 100;
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 10px;

        color: #e5c77b;
        font-size: 21px;
        font-weight: 900;
        letter-spacing: 3px;
    }

    .logo span {
        font-size: 24px;
    }

    .nav-links {
        display: flex;
        align-items: center;
        gap: 28px;
        list-style: none;
    }

    .nav-links a {
        color: #9daab6;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 1.5px;
        transition: 0.25s;
    }

    .nav-links a:hover {
        color: #62d9ff;
    }

    .nav-button {
        padding: 11px 18px;

        border: 1px solid #e5c77b;
        border-radius: 3px;

        color: #e5c77b !important;

        font-size: 11px !important;
        letter-spacing: 1.5px;

        transition: 0.25s;
    }

    .nav-button:hover {
        background: #e5c77b;
        color: #06101a !important;
    }

    /* =========================
       MAIN
    ========================= */

    main {
        width: 100%;
        height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        position: relative;

        padding: 90px 30px 30px;
    }

    /* Ocean glow */

    main::before {
        content: "";

        position: absolute;

        width: 700px;
        height: 700px;

        border-radius: 50%;

        background: rgba(0, 150, 210, 0.08);

        filter: blur(90px);

        pointer-events: none;
    }

    /* =========================
       PIRATE DECORATION
    ========================= */

    .compass {
        position: absolute;

        right: 7%;
        top: 20%;

        width: 180px;
        height: 180px;

        border: 1px solid rgba(229, 199, 123, 0.14);
        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        color: rgba(229, 199, 123, 0.12);

        font-size: 80px;

        transform: rotate(15deg);
    }

    .compass::before {
        content: "";

        position: absolute;

        width: 130px;
        height: 130px;

        border: 1px solid rgba(229, 199, 123, 0.12);

        border-radius: 50%;
    }

    .rope {
        position: absolute;

        left: -30px;
        bottom: 10%;

        width: 220px;
        height: 1px;

        background: rgba(229, 199, 123, 0.15);

        transform: rotate(-20deg);
    }

    /* =========================
       CONTENT
    ========================= */

    .content {
        position: relative;

        width: 100%;
        max-width: 1050px;

        text-align: center;

        z-index: 2;
    }

    .eyebrow {
        color: #62d9ff;

        font-size: 11px;
        font-weight: bold;

        letter-spacing: 6px;

        margin-bottom: 20px;
    }

    .title {
        color: #e5c77b;

        font-size: clamp(55px, 9vw, 105px);

        font-weight: 900;

        letter-spacing: 10px;

        line-height: 0.9;

        text-shadow:
            0 0 30px rgba(229, 199, 123, 0.12),
            0 12px 40px rgba(0, 0, 0, 0.7);
    }

    .subtitle {
        margin-top: 14px;

        font-size: clamp(18px, 3vw, 28px);

        letter-spacing: 9px;

        color: #f4f1e6;

        font-weight: 600;
    }

    .description {
        max-width: 620px;

        margin: 25px auto 0;

        color: #8998a6;

        font-size: 14px;

        line-height: 1.8;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
        display: inline-flex;

        align-items: center;
        gap: 10px;

        margin-top: 22px;

        padding: 9px 17px;

        background: rgba(255,255,255,0.025);

        border: 1px solid rgba(255,255,255,0.08);

        color: #8795a2;

        font-size: 10px;

        letter-spacing: 2px;
    }

    .status-dot {
        width: 7px;
        height: 7px;

        border-radius: 50%;

        background: #e5b95e;

        box-shadow: 0 0 10px rgba(229,185,94,0.6);
    }

    /* =========================
       BUTTONS
    ========================= */

    .buttons {
        display: flex;

        justify-content: center;

        flex-wrap: wrap;

        gap: 12px;

        margin-top: 28px;
    }

    .button {
        padding: 14px 24px;

        border-radius: 3px;

        font-size: 10px;

        font-weight: 900;

        letter-spacing: 1.5px;

        transition: 0.25s;
    }

    .primary {
        background: #e5c77b;
        color: #07101a;
    }

    .primary:hover {
        transform: translateY(-3px);

        box-shadow:
            0 10px 30px rgba(229,199,123,0.18);
    }

    .secondary {
        background: rgba(255,255,255,0.035);

        border: 1px solid rgba(255,255,255,0.16);

        color: #d8dee5;
    }

    .secondary:hover {
        border-color: #62d9ff;

        color: #62d9ff;

        transform: translateY(-3px);
    }

    /* =========================
       LOWER CARDS
    ========================= */

    .cards {
        display: grid;

        grid-template-columns: repeat(3, 1fr);

        gap: 12px;

        max-width: 900px;

        margin: 35px auto 0;
    }

    .card {
        padding: 18px 20px;

        background:
            linear-gradient(
                145deg,
                rgba(12,29,43,0.85),
                rgba(4,12,20,0.9)
            );

        border: 1px solid rgba(255,255,255,0.07);

        text-align: left;

        transition: 0.25s;
    }

    .card:hover {
        border-color: rgba(98,217,255,0.35);

        transform: translateY(-3px);
    }

    .card-label {
        color: #62d9ff;

        font-size: 9px;

        letter-spacing: 2px;

        margin-bottom: 8px;
    }

    .card h3 {
        color: #e5c77b;

        font-size: 15px;

        margin-bottom: 6px;
    }

    .card p {
        color: #687888;

        font-size: 11px;

        line-height: 1.5;
    }

    /* =========================
       WIKI
    ========================= */

    .wiki-button {
        cursor: pointer;
    }

    .wiki-overlay {
        position: fixed;

        inset: 0;

        background:
            radial-gradient(
                circle,
                rgba(9,65,88,0.35),
                rgba(2,7,12,0.97)
            );

        backdrop-filter: blur(15px);

        display: none;

        align-items: center;
        justify-content: center;

        z-index: 500;
    }

    .wiki-overlay.active {
        display: flex;
    }

    .wiki-box {
        width: min(500px, 90%);

        padding: 55px 30px;

        text-align: center;

        background:
            linear-gradient(
                145deg,
                #0b1b28,
                #050d15
            );

        border: 1px solid rgba(229,199,123,0.2);

        box-shadow:
            0 30px 80px rgba(0,0,0,0.6);
    }

    .magnifying-glass {
        font-size: 55px;

        margin-bottom: 20px;

        filter:
            drop-shadow(
                0 0 12px rgba(98,217,255,0.25)
            );
    }

    .wiki-box h2 {
        color: #e5c77b;

        font-size: 30px;

        letter-spacing: 4px;
    }

    .wiki-box p {
        color: #7e8d9b;

        margin-top: 15px;

        font-size: 13px;

        line-height: 1.7;
    }

    .close {
        display: inline-block;

        margin-top: 25px;

        padding: 11px 22px;

        border: 1px solid rgba(255,255,255,0.15);

        color: #b8c1ca;

        font-size: 10px;

        letter-spacing: 2px;

        cursor: pointer;

        transition: 0.25s;
    }

    .close:hover {
        border-color: #62d9ff;

        color: #62d9ff;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
        position: fixed;

        bottom: 20px;

        left: 0;

        width: 100%;

        text-align: center;

        color: #455462;

        font-size: 9px;

        letter-spacing: 1.5px;
    }

    .footer strong {
        color: #8d7846;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

        html, body {
            overflow: auto;
        }

        main {
            min-height: 100vh;
            height: auto;

            padding-top: 110px;
            padding-bottom: 80px;
        }

        .nav-links {
            display: none;
        }

        .compass {
            opacity: 0.35;

            right: -50px;
        }

        .cards {
            grid-template-columns: 1fr;
        }

        .card {
            text-align: center;
        }

        .footer {
            position: relative;

            bottom: auto;

            padding: 20px;
        }
    }

    @media (max-width: 500px) {

        .logo {
            font-size: 16px;
            letter-spacing: 2px;
        }

        .nav-button {
            padding: 9px 12px;
        }

        .title {
            letter-spacing: 5px;
        }

        .subtitle {
            letter-spacing: 5px;
        }

        .description {
            font-size: 13px;
        }
    }
</style>
